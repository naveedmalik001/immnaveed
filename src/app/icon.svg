<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041E42" />
      <stop offset="100%" stop-color="#031730" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8C4" />
      <stop offset="100%" stop-color="#00D4E0" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Emblem Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#14B8C4" stroke-width="16" stroke-opacity="0.6"/>
  
  <!-- Inner Blueprint Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#tealGrad)" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- NM Typography Mark -->
  <text x="256" y="325" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="210" font-weight="900" fill="url(#tealGrad)" text-anchor="middle" letter-spacing="-8">NM</text>
  
  <!-- Subtle Amber Sparkle Accent Dot -->
  <circle cx="410" cy="115" r="22" fill="#F7931E" />
  <circle cx="410" cy="115" r="32" fill="#F7931E" fill-opacity="0.3" />
</svg>
